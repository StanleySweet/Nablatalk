version: "2"
run:
  timeout: 2m
linters:
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - canonicalheader
  settings:
    revive:
      severity: warning
    gosec:
      severity: medium
    errcheck:
      check-type-assertions: true
formatters:
  enable:
    - gofmt
    - goimports
